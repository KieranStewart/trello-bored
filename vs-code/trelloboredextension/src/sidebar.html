<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Bored</title>
    <link rel="stylesheet" href="./style/sidebar.css">
</head>
<body>
    <h2>Trello Board Changes</h2>
    <div class="settings">
        <label>Server Base URL:</label>
        <input type="text" id="serverUrl" placeholder="http://localhost:8080">
        <label>Username:</label>
        <input type="text" id="username" placeholder="Enter username">
        <label>Session ID:</label>
        <input type="text" id="sessionId" placeholder="Enter session ID">
        <label>User ID:</label>
        <input type="text" id="userId" placeholder="Enter user ID">
        <button onclick="saveSettings()">Save Settings</button>
        <button onclick="createSession()">Create Session</button>
    </div>
    <div class="nav-buttons">
        <button class="nav-btn active" onclick="showView('approve')">Approve Request</button>
        <button class="nav-btn" onclick="showView('todo')">To-Do</button>
        <button class="nav-btn" onclick="showView('historical')">Historical Changes</button>
    </div>
    <div id="content"></div>
    <script src="./script/sidebar.js"></script>
</body>
</html>
