name: Call update when branch is merged

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  if_merged:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Make update request
        run: |
          curl 'https://22gwilliams.pythonanywhere.com/admin/serverupdate' \
          --header 'admin-key: jX5EkKDMue1xaQ'