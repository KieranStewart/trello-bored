name: Call server api when a review is submitted

on:
  pull_request_review:
    types:
      - submitted

jobs:
  on_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate diff
        shell: bash
        run: |
          git fetch origin main
          git diff origin/main..HEAD > mydiff
          echo "mydiff ="
          cat mydiff

      - name: POST to /review
        run: |
          DIFF=$(cat mydiff)
          curl --request POST \
            --url '${{ secrets.SERVER_URL }}/review' \
            --header 'Content-Type: application/json' \
            --header 'session-id: ${{ secrets.SESSION_ID }}' \
            --data "{\"username\": \"${{ github.event.review.user.login }}\", \"pr-number\": \"${{ github.event.pull_request.number }}\", \"diff\": $(echo "$DIFF" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}"
