name: Call server api when branch is merged

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  if_merged:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate diff
        shell: bash
        run: |
          git fetch origin main
          git diff origin/main..HEAD > mydiff
          echo "mydiff ="
          cat mydiff

      - name: POST to /merge
        run: |
          DIFF=$(cat mydiff)
          curl --request POST \
            --url '${{ secrets.SERVER_URL }}/merge' \
            --header 'Content-Type: application/json' \
            --header 'session-id: ${{ secrets.SESSION_ID }}' \
            --data "{\"username\": \"${{ github.event.pull_request.user.login }}\", \"branch-name\": \"${{ github.head_ref }}\", \"diff\": $(echo "$DIFF" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}"
